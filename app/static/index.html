<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Alexandria</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles/tokens.css">
  <link rel="stylesheet" href="/static/styles/shell.css">
  <link rel="stylesheet" href="/static/styles/components.css">
</head>
<body data-shell-state="loading">
  <a class="visually-hidden skip-link" href="#canonical-destination-root">Skip to workspace</a>
  <div data-shell-mount></div>
  <div data-overlay-root></div>
  <main class="workspace" data-bootstrap-error hidden>
    <article aria-labelledby="bootstrap-error-heading">
      <h1 id="bootstrap-error-heading" tabindex="-1">Alexandria could not start</h1>
      <p role="alert">Application shell unavailable. Reload Alexandria; your project files were not changed.</p>
    </article>
  </main>
  <script>
    globalThis.AlexandriaBootstrap = (() => {
      const fallback = document.querySelector('[data-bootstrap-error]');
      const fail = () => {
        document.body.dataset.shellState = 'bootstrap-error';
        fallback.hidden = false;
        fallback.querySelector('h1').focus({ preventScroll: true });
      };
      return Object.freeze({ fail });
    })();
  </script>

  <script src="/static/navigation_routes.js" onerror="AlexandriaBootstrap.fail()"></script>
  <script src="/static/api_client.js" onerror="AlexandriaBootstrap.fail()"></script>
  <script src="/static/components/icon_button.js" onerror="AlexandriaBootstrap.fail()"></script>
  <script src="/static/components/button.js" onerror="AlexandriaBootstrap.fail()"></script>
  <script src="/static/components/form_controls.js" onerror="AlexandriaBootstrap.fail()"></script>
  <script src="/static/components/status.js" onerror="AlexandriaBootstrap.fail()"></script>
  <script src="/static/components/notice.js" onerror="AlexandriaBootstrap.fail()"></script>
  <script src="/static/components/disclosure.js" onerror="AlexandriaBootstrap.fail()"></script>
  <script src="/static/components/dialog.js" onerror="AlexandriaBootstrap.fail()"></script>
  <script src="/static/components/transport.js" onerror="AlexandriaBootstrap.fail()"></script>
  <script src="/static/shell_chrome.js" onerror="AlexandriaBootstrap.fail()"></script>
  <script>
    (() => {
      try {
        const UI = globalThis.AlexandriaUI;
      const navigation = UI.navRail({
        brandHref: '#/projects',
        groups: [
          { label: 'Global', items: [
            { label: 'Home', href: '#/projects', icon: 'grid' },
            { label: 'Library', href: '#/library', icon: 'book-open' },
            { label: 'Voices', href: '#/voices', icon: 'sliders' },
            { label: 'Templates', href: '#/templates', icon: 'grid' },
          ] },
          { label: 'Project', items: [
            { label: 'Script', href: '#/script', icon: 'grid' },
            { label: 'Cast', href: '#/cast', icon: 'user' },
            { label: 'Produce', href: '#/produce', icon: 'sliders' },
            { label: 'Export', href: '#/export', icon: 'grid' },
          ] },
          { label: 'System', items: [
            { label: 'Settings', href: '#/settings', icon: 'settings' },
            { label: 'More', href: '#/more', icon: 'more' },
          ] },
        ],
      });
      navigation.dataset.appRail = '';
      const groups = [...navigation.querySelectorAll('.nav-group')];
      ['global', 'project', 'system'].forEach((name, index) => {
        groups[index].dataset.navGroup = name;
        if (name === 'project') groups[index].hidden = true;
      });
      const projectCard = document.createElement('section');
      projectCard.className = 'nav-project-context';
      projectCard.dataset.navProjectContext = '';
      projectCard.hidden = true;
      const projectHeading = document.createElement('h2');
      projectHeading.className = 'utility-heading';
      projectHeading.textContent = 'Current project';
      const projectBody = document.createElement('div');
      projectBody.className = 'nav-project-card';
      const projectCover = document.createElement('span');
      projectCover.className = 'nav-project-cover';
      projectCover.append(UI.icon('book-open'));
      const projectCopy = document.createElement('div');
      projectCopy.className = 'nav-project-copy';
      const projectName = document.createElement('strong');
      projectName.dataset.navProjectTitle = '';
      projectName.textContent = 'Project workspace';
      const projectProgress = document.createElement('span');
      projectProgress.className = 'metadata';
      projectProgress.dataset.navProjectProgress = '';
      projectProgress.textContent = 'Loading project stages';
      projectCopy.append(projectName, projectProgress);
      projectBody.append(projectCover, projectCopy);
      projectCard.append(projectHeading, projectBody);
      navigation.insertBefore(projectCard, groups[1]);
      for (const link of navigation.querySelectorAll('a[href^="#/"]')) {
        link.dataset.routeLink = '';
        link.dataset.routeBase = link.getAttribute('href').slice(2);
      }

      const globalHeader = UI.globalHeader({ eyebrow: 'Alexandria', title: 'Project Home' });
      globalHeader.dataset.globalHeader = '';
      globalHeader.querySelector('.header-actions').dataset.globalActions = '';
      const projectStatus = UI.status({ tone: 'information', label: 'Loading', live: true });
      const projectHeader = UI.projectHeader({
        title: 'Project workspace',
        stages: ['Script', 'Cast', 'Produce', 'Export'].map((label) => ({ label, state: 'future' })),
        actions: projectStatus,
      });
      projectHeader.dataset.projectHeader = '';
      projectHeader.hidden = true;
      projectHeader.querySelector('.project-title').dataset.shellProjectTitle = '';
      projectHeader.querySelector('.header-actions').dataset.projectActions = '';
      const initialSave = UI.inlineSave({ state: 'saved', label: 'Saved' });
      initialSave.dataset.shellSave = '';
      projectHeader.querySelector('.project-context').append(initialSave);

      const destination = document.createElement('main');
      destination.id = 'canonical-destination-root';
      destination.className = 'workspace';
      destination.dataset.canonicalDestinationRoot = '';
      destination.tabIndex = -1;
      const content = document.createElement('div');
      content.dataset.inspectorContent = '';
      content.append(destination);
      const inspectorSlot = document.createElement('div');
      inspectorSlot.dataset.shellInspectorSlot = '';
      inspectorSlot.append(content);
      const inspector = UI.shellInspector({
        state: 'collapsed',
        label: 'Project inspector',
        title: 'Project inspector',
        content: 'Select a project workspace to inspect its context.',
      });
      inspector.mountInline(inspectorSlot);
      const player = UI.persistentPlayer({ state: 'inactive' });
      player.dataset.persistentPlayer = '';
      const shell = UI.appShell({
        navigation,
        header: [globalHeader, projectHeader],
        main: inspectorSlot,
        player,
      });
      shell.dataset.appShell = '';
      document.querySelector('[data-shell-mount]').replaceWith(shell);
      const overlay = document.querySelector('[data-overlay-root]');
      overlay.id = 'canonical-overlay-root';
      } catch (error) {
        AlexandriaBootstrap.fail(error);
      }
    })();
  </script>
  <script type="module">
    import('/static/app_shell.js')
      .then(() => globalThis.AlexandriaShellReady)
      .catch((error) => AlexandriaBootstrap.fail(error));
  </script>
</body>
</html>
