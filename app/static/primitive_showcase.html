<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alexandria foundation and primitive contract</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body class="showcase-document">
  <div id="showcase-root"></div>
  <script src="components/button.js"></script>
  <script src="components/icon_button.js"></script>
  <script src="components/form_controls.js"></script>
  <script src="components/status.js"></script>
  <script src="components/notice.js"></script>
  <script src="components/disclosure.js"></script>
  <script src="components/dialog.js"></script>
  <script src="components/transport.js"></script>
  <script>
    'use strict';
    (() => {
      const UI = globalThis.AlexandriaUI;
      const node = (tag, className = '', text = '') => {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = text;
        return element;
      };
      const contract = (element, state) => { element.dataset.contractState = state; return element; };
      const row = (...children) => { const element = node('div', 'showcase-state-row'); element.append(...children); return element; };
      const specimen = (title, ...children) => { const element = node('article', 'showcase-specimen'); element.append(node('h3', 'entity-title', title), ...children); return element; };
      const section = (id, title, ...children) => {
        const element = node('section', 'showcase-section');
        if (id) element.id = id;
        element.append(node('h2', 'section-title', title), ...children);
        return element;
      };
      const grid = (...children) => { const element = node('div', 'showcase-grid'); element.append(...children); return element; };

      const navigation = UI.navRail({ groups: [
        { label: 'Project', items: [
          { label: 'Foundation', href: '#foundation', icon: 'grid', current: true },
          { label: 'Controls', href: '#forms', icon: 'sliders' },
          { label: 'Cast', href: '#cast', icon: 'user' },
          { label: 'Transport', href: '#transport', icon: 'play' },
        ] },
        { label: 'Application', items: [
          { label: 'Settings', href: '#settings', icon: 'settings' },
          { label: 'Maintenance', href: '#maintenance', icon: 'maintenance' },
        ] },
      ] });
      const globalHeader = UI.globalHeader({
        eyebrow: 'Design system · B19-T06', title: 'Soft Editorial Instrumentation',
        actions: UI.status({ label: 'Contract ready', tone: 'success', live: true }),
      });
      const main = node('main', 'showcase-main');
      main.id = 'foundation';
      main.append(UI.pageTitleBlock({
        title: 'Foundation & primitive contract',
        subtitle: 'One live semantic surface built only from Alexandria production factories. It does not mount, hide, or restyle a legacy workspace.',
      }));

      const projectHeader = UI.projectHeader({
        eyebrow: 'The Cartographer’s Guest', title: 'Cast workspace', className: 'showcase-specimen',
        stages: [
          { label: 'Project', state: 'complete' }, { label: 'Cast', state: 'current' },
          { label: 'Produce', state: 'future' }, { label: 'Export', state: 'blocked' },
        ],
        actions: UI.button({ label: 'Save project', variant: 'primary', size: 'large' }),
      });
      main.append(section('shell', 'Shell geometry', node('p', 'showcase-caption', 'The terracotta book mark, connected non-color-only tracker, and wide, compact, and narrow shell modes are one standalone production system.'), projectHeader));

      const primaryDefault = UI.button({ label: 'Save project', variant: 'primary', size: 'large', attributes: { 'data-width-group': 'primary-action' } });
      const primaryHover = UI.button({ label: 'Save project', variant: 'primary', size: 'large', state: 'hover', attributes: { 'data-width-group': 'primary-action' } });
      const actionStates = row(
        primaryDefault, primaryHover,
        UI.button({ label: 'Pressed', variant: 'primary', state: 'pressed' }),
        UI.button({ label: 'Focused', variant: 'primary', state: 'focused' }),
        UI.button({ label: 'Loading', variant: 'primary', state: 'loading' }),
        UI.button({ label: 'Disabled', disabled: true }),
        UI.button({ label: 'Quiet', variant: 'quiet' }),
        UI.button({ label: 'Delete', variant: 'destructive' }),
      );
      const iconStates = row(
        UI.iconButton({ label: 'Search', name: 'search' }),
        UI.iconButton({ label: 'More actions', name: 'more', size: 'compact' }),
        UI.iconButton({ label: 'Unavailable action', name: 'menu', disabled: true }),
      );
      main.append(section('actions', 'Actions', grid(specimen('Button hierarchy', actionStates), specimen('Icon actions', iconStates))));

      const fields = specimen('Fields and validation',
        UI.field({ id: 'project-title', label: 'Project title', value: 'The Cartographer’s Guest', description: 'Shown in Library and export metadata.' }),
        UI.field({ id: 'project-summary', kind: 'textarea', label: 'Editorial note', value: 'Measured pacing with restrained, intimate delivery.' }),
        UI.field({ id: 'language', kind: 'select', label: 'Language', value: 'en-GB', options: [{ value: 'en-GB', label: 'English (United Kingdom)' }, { value: 'en-US', label: 'English (United States)' }] }),
        UI.field({ id: 'project-name', label: 'Required project name', invalid: true, message: 'Enter a name before continuing.', messageId: 'project-name-error' }),
        UI.field({ label: 'Generated identifier', value: 'alex-042', readOnly: true }),
        UI.field({ label: 'Unavailable model', value: 'Downloading', disabled: true }),
      );
      const choices = specimen('Choices and disabled states',
        contract(UI.checkbox({ label: 'Checked', checked: true }), 'checkbox:checked'),
        contract(UI.checkbox({ label: 'Unchecked' }), 'checkbox:unchecked'),
        contract(UI.checkbox({ label: 'Mixed selection', indeterminate: true }), 'checkbox:indeterminate'),
        contract(UI.checkbox({ label: 'Keyboard focus', visualFocus: true }), 'checkbox:focused'),
        contract(UI.checkbox({ label: 'Disabled selection', disabled: true }), 'checkbox:disabled'),
        UI.radioGroup({ label: 'Delivery pace', options: [{ label: 'Measured', checked: true }, { label: 'Conversational' }] }),
        contract(UI.radioGroup({ label: 'Unavailable pace', disabled: true, options: [{ label: 'Measured' }, { label: 'Conversational' }] }), 'radio-group:disabled'),
        UI.toggle({ label: 'Reduce interface motion' }),
        contract(UI.toggle({ label: 'Unavailable preference', disabled: true }), 'toggle:disabled'),
        UI.segmentedControl({ label: 'Density', options: [{ label: 'Comfortable', selected: true }, { label: 'Compact' }] }),
        contract(UI.segmentedControl({ label: 'Unavailable view', disabled: true, options: [{ label: 'List', selected: true }, { label: 'Grid' }] }), 'segmented-control:disabled'),
        UI.filterChip({ label: 'Needs voice', pressed: true }),
        contract(UI.filterChip({ label: 'Unavailable filter', disabled: true }), 'filter-chip:disabled'),
      );
      const secrets = specimen('Credential intent with announcements',
        contract(UI.secretField({ label: 'Preserve existing token', mode: 'preserve' }), 'secret:preserve'),
        contract(UI.secretField({ label: 'Replace token', mode: 'replace' }), 'secret:replace'),
        contract(UI.secretField({ label: 'Clear token', mode: 'clear' }), 'secret:clear'),
      );
      const search = specimen('Search and selection', UI.searchField({ label: 'Search characters', placeholder: 'Search characters' }), UI.listbox({ label: 'Voices', items: [
        { initials: 'MA', label: 'Mara', meta: 'Warm alto', selected: true }, { initials: 'LE', label: 'Lena', meta: 'Clear mezzo' },
      ] }));
      main.append(section('forms', 'Form controls', grid(fields, choices, secrets, search)));

      const structureList = UI.dividerList({ items: [
        'Identity remains independent from voice assignment.',
        'Voice controls precede appearance in a Cast profile.',
        'Generated evidence is never presented as source artwork.',
      ] });
      const structure = UI.flatSection({ title: 'Flat section with dividers', content: structureList });
      const media = specimen('Media identities', row(
        UI.monogram({ initials: 'AV', label: 'Monogram for Amara Vale' }),
        UI.portrait({ label: 'Portrait evidence unavailable' }), UI.sourceCover({ label: 'Source cover evidence unavailable' }),
      ));
      main.append(section('structure', 'Structural primitives', grid(structure, media)));

      const progressStates = specimen('Progress lifecycle and live milestones',
        contract(UI.progress({ label: 'Queued import', state: 'idle', value: 0 }), 'progress:idle'),
        contract(UI.progress({ label: 'Model download', state: 'running', value: 64 }), 'progress:running'),
        contract(UI.progress({ label: 'Interrupted download', state: 'resumable', value: 42 }), 'progress:resumable'),
        contract(UI.progress({ label: 'Canceled export', state: 'canceled', value: 28 }), 'progress:canceled'),
        contract(UI.progress({ label: 'Complete index', state: 'complete', value: 100 }), 'progress:complete'),
        contract(UI.progress({ label: 'Failed model', state: 'error', value: 18 }), 'progress:error'),
        UI.inlineSave({ state: 'saved', label: 'Saved at 14:32' }), UI.inlineSave({ state: 'dirty', label: 'Unsaved changes' }),
      );
      const notices = specimen('Notices',
        contract(UI.notice({ tone: 'information', title: 'Model detail', body: 'Structured speech controls are supported.' }), 'notice:information'),
        contract(UI.notice({ tone: 'warning', title: 'Review before export', body: 'Two profiles use the narrator fallback.' }), 'notice:warning'),
        contract(UI.notice({ tone: 'success', title: 'Catalog indexed', body: 'All local voices are available.' }), 'notice:success'),
        contract(UI.notice({ tone: 'error', blocking: true, title: 'Export blocked', body: 'Resolve the missing narrator voice first.' }), 'notice:blocking'),
      );
      const contentStates = specimen('Partial, recoverable, and dense content',
        contract(UI.flatSection({ title: 'Partial result', body: 'Three of four chapters are ready; the remaining chapter is still visible as pending.' }), 'content:partial'),
        contract(UI.flatSection({ title: 'Recoverable failure', body: 'The previous transcript is preserved and retry remains available.', content: UI.button({ label: 'Retry transcript', variant: 'secondary' }) }), 'content:recoverable'),
        contract(UI.flatSection({ title: 'Dense audit history', className: 'content-state', content: UI.dividerList({ items: ['14:31 Voice verified', '14:32 Transcript saved', '14:34 Preview rendered', '14:35 Profile ready'] }) }), 'content:dense'),
      );
      contentStates.lastElementChild.dataset.density = 'dense';
      const popover = UI.popover({ label: 'Character actions', openerLabel: 'Character actions', testId: 'popover-opener', items: ['Duplicate profile', 'Move to extras'] });
      popover.classList.add('showcase-popover-anchor');
      const outsideTarget = UI.button({ label: 'Outside popover target', variant: 'quiet', attributes: { 'data-test': 'outside-target' } });
      const disclosure = specimen('Disclosure and popover', UI.disclosure({ label: 'Advanced voice controls', body: 'Temperature, seed, and delivery overrides appear only when supported.', testId: 'disclosure-trigger' }), popover, outsideTarget);
      main.append(section('feedback', 'Status and feedback', grid(progressStates, notices, contentStates, specimen('Loading and empty states', UI.skeleton({ label: 'Loading voice list' }), UI.emptyState({ title: 'No takes yet', body: 'Generate a first take when the profile is ready.', action: UI.button({ label: 'Generate take', variant: 'primary' }) })), disclosure)));

      const modalOpener = UI.button({ label: 'Open modal', attributes: { 'data-test': 'modal-opener' } });
      UI.dialog({ kind: 'modal', title: 'Confirm export', body: 'Review chapter ordering and delivery metadata.', opener: modalOpener, confirmLabel: 'Export' });
      const drawerOpener = UI.button({ label: 'Open inspector', attributes: { 'data-test': 'drawer-opener' } });
      UI.dialog({ kind: 'drawer', title: 'Character inspector', body: 'Contextual controls overlay compact workspaces.', opener: drawerOpener, confirmLabel: 'Apply' });
      const dirtyOpener = contract(UI.button({ label: 'Edit unsaved profile', attributes: { 'data-test': 'dirty-opener' } }), 'dialog:dirty');
      UI.dialog({ kind: 'modal', title: 'Unsaved character profile', body: 'This profile contains unsaved changes.', opener: dirtyOpener, dirty: true, onSave: () => { document.documentElement.dataset.dirtyResolution = 'save'; } });
      main.append(section('layers', 'Transient layers', row(modalOpener, drawerOpener, dirtyOpener)));

      const compactStates = specimen('Compact play lifecycle', row(
        contract(UI.compactPlay({ state: 'loading' }), 'compact-play:loading'),
        contract(UI.compactPlay({ state: 'ready' }), 'compact-play:ready'),
        contract(UI.compactPlay({ state: 'playing' }), 'compact-play:playing'),
        contract(UI.compactPlay({ state: 'paused' }), 'compact-play:paused'),
        contract(UI.compactPlay({ state: 'failed' }), 'compact-play:failed'),
        contract(UI.compactPlay({ state: 'disabled' }), 'compact-play:disabled'),
      ));
      const waveform = specimen('Keyboard waveform', UI.waveform({ value: 42, maximum: 180, label: 'Sample position', testId: 'waveform-slider' }));
      const playerStates = specimen('Persistent player lifecycle',
        contract(UI.persistentPlayer({ state: 'loading' }), 'persistent-player:loading'),
        contract(UI.persistentPlayer({ state: 'paused' }), 'persistent-player:paused'),
        contract(UI.persistentPlayer({ state: 'failed' }), 'persistent-player:failed'),
      );
      playerStates.classList.add('showcase-specimen--wide');
      main.append(section('transport', 'Audio transport', grid(compactStates, waveform, playerStates)));

      const castList = UI.listbox({ label: 'Characters', items: [
        { initials: 'AV', label: 'Amara Vale', meta: 'Narrator · Voice assigned', selected: true },
        { initials: 'EK', label: 'Elias Kern', meta: 'Character · Needs voice' },
      ] });
      const voice = node('section', 'cast-composite__voice');
      voice.append(node('h4', 'entity-title', 'Voice'), node('p', '', 'Transcript, audio evidence, audition preview, and assignment stay together before Appearance.'), UI.field({ label: 'Assigned voice', kind: 'select', value: 'Mara', options: ['Mara', 'Lena', 'Unassigned'] }), UI.compactPlay({ state: 'ready', label: 'Audition Mara' }), UI.disclosure({ label: 'Character summary and advanced voice controls', body: 'Amara is measured and observant. Temperature, seed, and delivery overrides remain capability-gated.' }));
      const personaExpanded = contract(UI.flatSection({ title: 'Persona Visual', className: 'persona-visual', body: 'Expanded inside the selected Cast profile, after Voice. This evidence supports appearance and never becomes a separate workspace.', content: UI.portrait({ label: 'Persona visual evidence unavailable' }) }), 'persona:expanded');
      const personaEmpty = contract(UI.flatSection({ title: 'No visual evidence', className: 'persona-visual', body: 'No source portrait was supplied. Alexandria does not invent one.' }), 'persona:no-evidence');
      const detail = UI.flatSection({ eyebrow: 'Selected profile', title: 'Amara Vale', className: 'cast-composite__detail', content: [voice, node('h4', 'entity-title', 'Appearance'), personaExpanded, personaEmpty] });
      main.append(section('cast', 'Cast profile composition', UI.masterDetail({ master: castList, detail })));

      const maintenanceLink = contract(UI.button({ label: 'Open Maintenance', variant: 'secondary', attributes: { 'data-test': 'maintenance-link' } }), 'maintenance:deep-link');
      const settings = UI.flatSection({ eyebrow: 'Route: Settings', title: 'Experience preferences', body: 'Theme, motion, density, captions, and model defaults are ordinary settings.', content: [UI.toggle({ label: 'Reduce motion' }), UI.segmentedControl({ label: 'Interface density', options: [{ label: 'Comfortable', selected: true }, { label: 'Compact' }] }), maintenanceLink] });
      const maintenanceHeading = node('h3', 'entity-title', 'Runtime stewardship');
      maintenanceHeading.tabIndex = -1;
      maintenanceHeading.dataset.test = 'maintenance-heading';
      const maintenance = UI.flatSection({ id: 'maintenance', eyebrow: 'Route: Maintenance', content: [maintenanceHeading, node('p', '', 'Cache inspection, diagnostics, and guarded cleanup remain a distinct operational destination.'), UI.notice({ tone: 'warning', title: 'Guarded action', body: 'Cleanup reports exact targets before it can run.' }), UI.button({ label: 'Preview cleanup', variant: 'destructive' })] });
      let maintenanceReturn = null;
      maintenanceLink.addEventListener('click', () => { maintenanceReturn = maintenanceLink; history.pushState({ route: 'maintenance' }, '', '#maintenance'); maintenanceHeading.focus(); });
      addEventListener('popstate', () => { if (location.hash !== '#maintenance') maintenanceReturn?.focus(); });
      const ownership = node('div', 'settings-maintenance');
      ownership.append(settings, maintenance);
      main.append(section('settings', 'Settings and Maintenance ownership', ownership));

      const motion = node('div', 'motion-probe');
      motion.dataset.motionProbe = 'true';
      motion.setAttribute('aria-hidden', 'true');
      main.append(section('motion', 'Motion contract', node('p', 'showcase-caption', 'The probe supplies captured rest, midpoint, settled, and reduced-motion states.'), motion));
      const shellPlayer = contract(UI.persistentPlayer({ state: 'playing' }), 'persistent-player:playing');
      const shell = UI.appShell({ navigation, header: globalHeader, main, player: shellPlayer });
      document.getElementById('showcase-root').replaceChildren(shell);
      document.documentElement.dataset.showcaseReady = 'true';
    })();
  </script>
</body>
</html>
