<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alexandria multi-Voice blind screen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div><p class="eyebrow">Alexandria · Boundary 18</p><h1>Multi-Voice archetype screen</h1></div>
    <div id="progress" aria-live="polite"></div>
  </header>
  <nav class="toolbar" aria-label="Review actions">
    <button id="next-incomplete" type="button">Next incomplete</button>
    <label class="file-button">Import review<input id="import" type="file" accept="application/json"></label>
    <button id="backup" type="button">Back up current progress</button>
    <button id="export" type="button" disabled>Export completed review</button>
  </nav>
  <main>
    <p class="rule" id="rule"></p>
    <p class="incomplete-summary" id="incomplete-summary" aria-live="polite"></p>
    <div id="app"></div>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
